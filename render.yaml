# Render Blueprint — deploys the voice agent as an always-on web service.
# In Render: New + → Blueprint → connect this repo → it reads this file.
# Then set the secret env vars (marked sync:false) in the dashboard.
services:
  - type: web
    name: hvr-voice-agent
    runtime: python
    plan: starter # always-on (~$7/mo). The free plan sleeps on idle → misses calls.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Voice engine (non-secret config)
      - key: VOICE_MODE
        value: realtime
      - key: REALTIME_PROVIDER
        value: grok
      - key: GROK_VOICE
        value: Ara
      # Secrets — set these in the Render dashboard (not committed)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY # for the knowledge base (embeddings); optional otherwise
        sync: false
      - key: DATABASE_URL # set to your Neon URL for multi-tenant; leave blank for single-tenant
        sync: false
      # PUBLIC_HOST is auto-detected from RENDER_EXTERNAL_HOSTNAME — no need to set it.
